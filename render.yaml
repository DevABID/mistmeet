# Render Blueprint for MIST Meet.
# Render dashboard → New → Blueprint → pick this GitHub repo.
# Creates: PostgreSQL database, Django API (web service), React frontend (static site).

databases:
  - name: mist-meet-db
    plan: free
    databaseName: mistmeet
    user: mistmeet

services:
  # ---------------------------------------------------------------- Django API
  - type: web
    name: mist-meet-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migrations run on every start, so new database tables always exist before the app serves requests.
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT mistmeet.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mist-meet-db
          property: connectionString
      # Optional TURN server for users behind strict firewalls
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # ---------------------------------------------------------------- React frontend
  - type: web
    name: mist-meet
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Send every path (/abc-defg-hij, /report/…) to the React app.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's address, e.g. https://mist-meet-api.onrender.com (no trailing slash)
      - key: VITE_API_ORIGIN
        sync: false
